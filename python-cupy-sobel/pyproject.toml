[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cupy-sobel"
version = "0.1.0"
description = "A Python image-processing pipeline with a custom CuPy CUDA kernel."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_edges = ["kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
